changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions[bot]
  categories:
    - title: Core
      labels:
        - core
    - title: Build, Packaging, and Release
      labels:
        - build
    - title: Documentation
      labels:
        - documentation
    - title: Tests
      labels:
        - tests
    - title: Language Support
      labels:
        - language-support
    - title: Other Changes
      labels:
        - "*"
