name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements:
    name: Requirements / Python 3.14
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bootstrap patched pip
        run: >-
          python -m pip install
          "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Install exported requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check dependency manifests
        run: python -m pytest tests/test_dependency_manifests.py

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bootstrap patched pip
        run: >-
          python -m pip install
          "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Install Poetry
        run: python -m pip install poetry==2.4.2

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run lint
        run: poetry run ruff check src tests

      - name: Check formatting
        run: poetry run black --check src tests

      - name: Run tests
        run: poetry run pytest -m "not api_key_required"

  container:
    name: Container / Python 3.13
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build fresh runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: co-op-translator:pr
          platforms: linux/amd64
          pull: true
          no-cache: true
          provenance: false

      - name: Build fresh ARM64 runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          pull: true
          no-cache: true
          outputs: type=oci,dest=/tmp/co-op-translator-arm64.tar
          provenance: false

      - name: Verify patched trust stores
        run: >-
          docker run --rm --entrypoint python co-op-translator:pr -c
          "from pathlib import Path;
          import hashlib, ssl;
          import certifi, pip;
          from packaging.version import Version;
          bundles = [Path(certifi.where()), Path('/etc/ssl/certs/ca-certificates.crt')];
          fingerprints = [{hashlib.sha256(c).hexdigest() for c in ssl.create_default_context(cafile=str(p)).get_ca_certs(binary_form=True)} for p in bundles];
          blocked = {'86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b', 'd7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4'};
          assert Version(certifi.__version__) >= Version('2026.10.19');
          assert Version(pip.__version__) >= Version('26.2.2');
          assert all(blocked.isdisjoint(bundle) for bundle in fingerprints)"

      - name: Smoke-test credential-free translation planning
        run: |
          mkdir -p .tmp/container-smoke
          printf '# Container smoke test\n' > .tmp/container-smoke/README.md
          docker run --rm -v "$PWD/.tmp/container-smoke:/work" co-op-translator:pr \
            -l ko -r /work --markdown --dry-run
